server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS. With a literal hostname in proxy_pass, nginx resolves `api` once
  # at startup and keeps that IP forever — so recreating the api container (an update, an
  # .env change) left every request failing with 502 until web was restarted too. Proxying
  # through a variable makes nginx re-resolve, honouring `valid`.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:4000;

  location /api/ {
    # With a variable and no URI part, the original request URI is passed unchanged.
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri /index.html;
  }
}
