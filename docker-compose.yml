services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: digital_identity
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./apps/api/src/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  # One-shot: populates demo data, then exits 0. Idempotent — re-running `up` is a no-op
  # once the database has people in it. Reuses the api image (cached layers, no second build).
  seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/seed.js"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/digital_identity
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    # The api image's inherited HEALTHCHECK curls /healthz; a seed container serves nothing
    # and would be marked unhealthy forever.
    healthcheck:
      disable: true

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/digital_identity
      PORT: "4000"
      WEB_BASE_URL: http://localhost:8080
      # Enables GET /api/demo/personas, which hands out edit tokens. Local demo only —
      # never set this in a real deployment.
      DEMO_MODE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  postgres-data:
